[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-bonsai-fusion"
version = "0.1.0"
description = "Clone open-source de Jev (System One, decisions typees calibrees) fusionne avec Bonsai 2 27B (System Two) pour RTX 4060 / materiel minimal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "requests>=2.31",
  "pydantic>=2.5",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
torch = ["torch>=2.3", "transformers>=4.57", "peft>=0.13"]
train = ["torch>=2.3", "transformers>=4.57", "peft>=0.13", "datasets>=2.19", "accelerate>=0.30", "bitsandbytes>=0.43"]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]
agent = ["playwright>=1.45"]

[project.scripts]
jev = "jev_clone.cli:main"

[tool.setuptools.packages.find]
include = ["jev_clone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

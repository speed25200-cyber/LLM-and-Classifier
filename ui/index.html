<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080b" />
    <title>Prophet Studio</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--PROPHET_BOOT-->
    <style>
      html, body { background: #07080b; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(139,124,255,.25); border-top-color: #8b7cff; animation: s .9s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

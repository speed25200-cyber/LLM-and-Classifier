# Paquets de l'application de bureau : Windows x64 (NSIS + MSI), Linux x64 (deb + AppImage),
# macOS Apple Silicon (dmg).
# * etiquette v* : brouillon de release GitHub avec les paquets et prophet-studio-web.zip (interface
#   precompilee, dernier recours des installateurs en ligne de commande) ; publier le brouillon a la main ;
# * lancement manuel (workflow_dispatch), ou push qui modifie la coquille de bureau : paquets en artefacts
#   du workflow, sans release (les installateurs restent verifies a chaque changement de desktop/).
name: Bureau

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    # ignores pour les etiquettes : une etiquette v* construit toujours
    paths: ["desktop/**", ".github/workflows/desktop.yml", "uv.lock"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # uv embarque dans l'application (sidecar prophet-uv), depuis les releases officielles astral-sh/uv
  UV_VERSION: "0.12.18"

jobs:
  release:
    name: Brouillon de release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return String(existing.id);
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Prophet Studio ${tag}`, draft: true, prerelease: false,
              body: [
                "Application de bureau Prophet Studio (Bonsai 2 27B + classifieur calibre, en local).",
                "",
                "* Windows 10/11 x64 : `Prophet Studio_*_x64-setup.exe` (sans droits administrateur) ou `.msi`.",
                "* Linux x64 : `.AppImage` (portable) ou `.deb`.",
                "* macOS Apple Silicon : `.dmg` (non notarise : clic droit > Ouvrir au premier lancement).",
                "",
                "RTX 50xx : pilote NVIDIA >= 570 requis. Au premier lancement, l'application prepare Python (1 a 3 minutes),",
                "puis l'assistant telecharge les modeles (~6 Go). Details : installer/README.md.",
              ].join("\n"),
            });
            return String(data.id);

  bundle:
    name: Paquets (${{ matrix.name }})
    needs: release
    # sans etiquette, le job `release` est saute : on construit quand meme (artefacts seulement)
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependances systeme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config \
            xdg-utils file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: uv ${{ env.UV_VERSION }} embarque (${{ matrix.target }})
        run: node desktop/scripts/fetch-uv.mjs --target ${{ matrix.target }}

      - name: Dependances npm (interface + CLI Tauri)
        run: |
          npm ci --prefix ui
          npm ci --prefix desktop

      # beforeBuildCommand construit l'interface (npm --prefix ../ui run build) avant la compilation.
      - name: Paquets Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: false

      - name: Artefacts du workflow
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: prophet-studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

  web:
    name: Interface web precompilee
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Construction
        run: npm ci --prefix ui && npm run build --prefix ui

      - name: Archive (index.html a la racine)
        run: cd ui/dist && zip -qr "$GITHUB_WORKSPACE/prophet-studio-web.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: prophet-studio-web
          path: prophet-studio-web.zip
          if-no-files-found: error

      - name: Ajout a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const name = 'prophet-studio-web.zip';
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            for (const asset of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name, data: fs.readFileSync(name) });
